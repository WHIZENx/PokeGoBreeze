<!doctype html>

    <base href="/" />

    <link rel="apple-touch-icon" sizes="180x180" href="/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f4f6" />
    <script>
      (function () {
        var theme = 'light';
        try {
          theme = JSON.parse(localStorage.getItem('theme')) === 'dark' ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#222222' : '#f3f4f6');
      })();
    </script>
    <style id="pre-hydration-shell-styles">
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f3f4f6;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      #seo-content {
        min-height: 100vh;
        min-height: 100svh;
        box-sizing: border-box;
        background: #f3f4f6;
      }

      .seo-shell-bar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        padding: 0 16px;
        background: #075eb8;
        color: #fff;
        box-shadow: 0 2px 6px rgb(0 0 0 / 28%);
      }

      .seo-shell-brand-mark,
      .seo-shell-spinner {
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        box-sizing: border-box;
        border: 3px solid #37474f;
        border-radius: 50%;
        background: linear-gradient(#ff3d00 0 44%, #37474f 44% 56%, #fff 56% 100%);
      }

      .seo-shell-brand-mark {
        width: 28px;
        height: 28px;
        border-width: 2px;
      }

      .seo-shell-brand-mark::after,
      .seo-shell-spinner::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 24%;
        height: 24%;
        transform: translate(-50%, -50%);
        border: 2px solid #37474f;
        border-radius: 50%;
        background: #fff;
      }

      .seo-shell-brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }

      .seo-shell-body {
        min-height: calc(100vh - 56px);
        min-height: calc(100svh - 56px);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        box-sizing: border-box;
        padding: 24px 16px;
      }

      .seo-shell-card {
        width: 100%;
        max-width: 440px;
        min-width: 0;
        box-sizing: border-box;
        padding: 24px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        text-align: center;
        box-shadow: 0 8px 24px rgb(0 0 0 / 12%);
      }

      .seo-shell-spinner {
        width: 56px;
        height: 56px;
        animation: seo-shell-turn 1.1s linear infinite;
      }

      .seo-shell-status {
        margin: 12px 0 16px;
        color: #5f6368;
        font-size: 14px;
        font-weight: 600;
      }

      .seo-shell-card h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .seo-shell-description {
        margin: 8px 0 0;
        color: #5f6368;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      :root[data-theme='dark'] body,
      :root[data-theme='dark'] #seo-content {
        background: #222;
        color: #fff;
      }

      :root[data-theme='dark'] .seo-shell-bar {
        background: #333;
      }

      :root[data-theme='dark'] .seo-shell-card {
        border-color: #555;
        background: #2b2b2b;
        box-shadow: 0 8px 24px rgb(0 0 0 / 40%);
      }

      :root[data-theme='dark'] .seo-shell-status,
      :root[data-theme='dark'] .seo-shell-description {
        color: #b0b0b0;
      }

      @keyframes seo-shell-turn {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .seo-shell-spinner {
          animation: none;
        }
      }

      @media (max-width: 575px) {
        .seo-shell-body {
          align-items: start;
          padding-top: 20vh;
        }

        .seo-shell-card {
          padding: 20px 16px;
        }

        .seo-shell-card h1 {
          font-size: 18px;
        }
      }
    </style>

    <!-- Structured data: must be BEFORE the inline script so getElementById('ld-json') resolves -->
    <script id="ld-json" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PokéGo Breeze",
        "url": "https://poke-go-breeze.vercel.app/",
        "description": "Comprehensive Pokémon GO database with stats, moves, counters, PVP rankings, raid guides, and simulation tools.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "PokéGoBreeze",
          "logo": {
            "@type": "ImageObject",
            "url": "https://poke-go-breeze.vercel.app/og-image.png"
          }
        }
      }
    </script>

    <script>
      (function () {
        // Expose SEO helpers for React components to update per-page meta tags
        window.SEO = {
          setKeywords: function (keywords) {
            var content = Array.isArray(keywords) ? keywords.join(', ') : String(keywords);
            document.getElementById('meta-keywords').setAttribute('content', content);
          },
          addKeywords: function (newKeywords) {
            var el = document.getElementById('meta-keywords');
            var current = el.getAttribute('content');
            var added = Array.isArray(newKeywords) ? newKeywords.join(', ') : String(newKeywords);
            el.setAttribute('content', current ? current + ', ' + added : added);
          },
          updateLdJson: function (data) {
            var ldScript = document.getElementById('ld-json');
            if (!ldScript) return;
            try {
              var ldData = JSON.parse(ldScript.textContent);
              if (data.name) ldData.name = data.name;
              if (data.description) ldData.description = data.description;
              if (data.url) ldData.url = data.url;
              if (data.image) ldData.image = data.image;
              ldScript.textContent = JSON.stringify(ldData);
            } catch (e) {}
          },
        };
      })();
    </script>
