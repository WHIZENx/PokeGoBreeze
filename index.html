    <meta name="theme-color" content="#f3f4f6" />
    <script>
      (function () {
        var theme = 'light';
        try {
          theme = JSON.parse(localStorage.getItem('theme')) === 'dark' ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#222222' : '#f3f4f6');
      })();
    </script>
    <style id="pre-hydration-shell-styles">
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f3f4f6;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      #seo-content {
        min-height: 100vh;
        min-height: 100svh;
        box-sizing: border-box;
        background: #f3f4f6;
      }

      .seo-shell-bar {
        height: 56px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px;
        background: #075eb8;
        color: #fff;
        box-shadow:
          0 2px 4px -1px rgb(0 0 0 / 20%),
          0 4px 5px 0 rgb(0 0 0 / 14%),
          0 1px 10px 0 rgb(0 0 0 / 12%);
        position: sticky;
        z-index: 1100;
        top: 0;
      }

      .seo-shell-toolbar {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
      }

      .seo-shell-brand-lockup {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .seo-shell-mobile-menu {
        width: 48px;
        height: 48px;
        display: none;
        flex: 0 0 48px;
        place-items: center;
        color: inherit;
      }

      .seo-shell-mobile-menu svg {
        display: block;
        width: 24px;
        height: 24px;
        fill: currentcolor;
      }

      .seo-shell-brand-icon {
        display: block;
        flex: 0 0 auto;
        box-sizing: border-box;
        object-fit: contain;
        width: 30px;
        height: 30px;
      }

      .seo-shell-brand {
        font-family: 'Roboto', 'Helvetica', 'Arial', sans-serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 24px;
        letter-spacing: 0.00938em;
        white-space: nowrap;
      }

      .seo-shell-theme-toggle {
        display: grid;
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        margin-left: auto;
        place-items: center;
        color: inherit;
      }

      .seo-shell-theme-toggle svg {
        display: block;
        grid-area: 1 / 1;
        width: 36px;
        height: 36px;
        fill: currentcolor;
      }

      .seo-shell-theme-toggle .seo-shell-theme-moon,
      :root[data-theme='dark'] .seo-shell-theme-toggle .seo-shell-theme-sun {
        display: none;
      }

      :root[data-theme='dark'] .seo-shell-theme-toggle .seo-shell-theme-moon {
        display: block;
      }

      .seo-shell-progress {
        position: absolute;
        z-index: 1;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        overflow: hidden;
        background: transparent;
        opacity: 0;
        animation: seo-shell-reveal 1ms linear 450ms forwards;
      }

      .seo-shell-progress::after {
        content: '';
        display: block;
        width: 35%;
        height: 100%;
        background: #1976d2;
        transform: translateX(-120%);
        animation: seo-shell-progress 1.1s ease-in-out infinite;
      }

      .seo-shell-seo-copy {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .seo-shell-seo-copy h1 {
        font-size: inherit;
      }

      :root[data-theme='dark'] body,
      :root[data-theme='dark'] #seo-content {
        background: #222;
        color: #fff;
      }

      :root[data-theme='dark'] .seo-shell-bar {
        background: #333;
        background-image: linear-gradient(rgb(255 255 255 / 9%), rgb(255 255 255 / 9%));
      }

      :root[data-theme='dark'] .seo-shell-progress::after {
        background: #90caf9;
      }

      @keyframes seo-shell-reveal {
        to {
          opacity: 1;
        }
      }

      @keyframes seo-shell-progress {
        from {
          transform: translateX(-120%);
        }

        to {
          transform: translateX(405%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .seo-shell-progress::after {
          width: 100%;
          transform: none;
          animation: none;
        }
      }

      @media (width < 900px) {
        .seo-shell-brand-lockup {
          display: none;
        }

        .seo-shell-mobile-menu {
          display: grid;
        }
      }

    <!-- Structured data: must be BEFORE the inline script so getElementById('ld-json') resolves -->
    <script id="ld-json" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PokéGo Breeze",
        "url": "https://poke-go-breeze.vercel.app/",
        "description": "Comprehensive Pokémon GO database with stats, moves, counters, PVP rankings, raid guides, and simulation tools.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "PokéGoBreeze",
          "logo": {
            "@type": "ImageObject",
            "url": "https://poke-go-breeze.vercel.app/og-image.png"
          }
        }

    </script>

    <script>
      (function () {
        // Expose SEO helpers for React components to update per-page meta tags
        window.SEO = {
          setKeywords: function (keywords) {
            var content = Array.isArray(keywords) ? keywords.join(', ') : String(keywords);
            document.getElementById('meta-keywords').setAttribute('content', content);
          },
          addKeywords: function (newKeywords) {
            var el = document.getElementById('meta-keywords');
            var current = el.getAttribute('content');
            var added = Array.isArray(newKeywords) ? newKeywords.join(', ') : String(newKeywords);
            el.setAttribute('content', current ? current + ', ' + added : added);
          },
          updateLdJson: function (data) {
            var ldScript = document.getElementById('ld-json');
            if (!ldScript) return;
            try {
              var ldData = JSON.parse(ldScript.textContent);
              if (data.name) ldData.name = data.name;
              if (data.description) ldData.description = data.description;
              if (data.url) ldData.url = data.url;
              if (data.image) ldData.image = data.image;
              ldScript.textContent = JSON.stringify(ldData);
            } catch (e) {}
          },
        };
      })();
    </script>
