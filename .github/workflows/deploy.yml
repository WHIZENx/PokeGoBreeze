name: Deploy

on:
  push:
    branches: [main, stage, develop]
  pull_request:

env:
  CI: true
  NODE_OPTIONS: --max_old_space_size=4096
  NODE_VERSION: '24'
  # App env vars (available to all jobs via global env)
  REACT_APP_DEPLOYMENT_MODE: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}
  APP_DEPLOYMENT_MODE: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}
  REACT_APP_TOKEN_PRIVATE_REPO: ${{ secrets.REACT_APP_TOKEN_PRIVATE_REPO }}
  REACT_APP_POKEGO_BREEZE_DB_URL: ${{ secrets.REACT_APP_POKEGO_BREEZE_DB_URL }}
  REACT_APP_EDGE_CONFIG: ${{ secrets.REACT_APP_EDGE_CONFIG }}
  REACT_APP_EDGE_ID: ${{ secrets.REACT_APP_EDGE_ID }}
  REACT_APP_EDGE_READ_TOKEN: ${{ secrets.REACT_APP_EDGE_READ_TOKEN }}
  REACT_APP_ENCRYPTION_KEY: ${{ secrets.REACT_APP_ENCRYPTION_KEY }}
  REACT_APP_ENCRYPTION_SALT: ${{ secrets.REACT_APP_ENCRYPTION_SALT }}
  REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Vercel: update Edge Config + deploy the pushed branch
  # Branches: main (production) | stage (staging) | develop (development)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-vercel:
    if: |
      github.event_name != 'pull_request' &&
      (github.ref_name == 'main' || github.ref_name == 'stage' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 
      github.ref_name == 'stage' && 'stage' || 
      github.ref_name == 'develop' && 'development' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mongosh
        run: npm install -g mongosh

      - name: Run Edge Config & version update
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
        env:
          VERCEL_TOKEN: ${{ secrets.REACT_APP_EDGE_TOKEN }}
          VERCEL_EDGE_CONFIG_ID: ${{ secrets.REACT_APP_EDGE_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy pushed branch to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          CLI_TOKEN="$VERCEL_TOKEN"
          unset VERCEL_TOKEN
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            vercel pull --yes --environment=production --token="$CLI_TOKEN"
            vercel build --prod --token="$CLI_TOKEN"
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token="$CLI_TOKEN")
            ALIAS=poke-go-breeze.vercel.app
          else
            vercel pull --yes --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$CLI_TOKEN"
            vercel build --token="$CLI_TOKEN"
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --token="$CLI_TOKEN")
            ALIAS="poke-go-breeze-${GITHUB_REF_NAME}.vercel.app"
          fi
          vercel alias set "$DEPLOYMENT_URL" "$ALIAS" --token="$CLI_TOKEN"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Firebase Hosting: build & deploy on push
  # Branches: main (production) | stage (staging) | develop (development)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-firebase:
    if: |
      github.event_name != 'pull_request' &&
      (github.ref_name == 'main' || github.ref_name == 'stage' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 
      github.ref_name == 'stage' && 'stage' || 
      github.ref_name == 'develop' && 'development' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      - name: Set Firebase target
        id: config
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "target=pokego-breeze" ;;
            stage)   echo "target=pokego-breeze-stage" ;;
            develop) echo "target=pokego-breeze-develop" ;;
          esac >> $GITHUB_OUTPUT

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npm run prebuild
          npm run generate:sitemap
          bash -c 'source ./config.sh && npx vite build'

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy \
            --project pokego-breeze \
            --only hosting:${{ steps.config.outputs.target }} \
            --non-interactive \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            -m "Branch: ${{ github.ref_name }} | RunID: ${{ github.run_id }} | SHA: ${{ github.sha }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.ref_name }}-${{ github.sha }}
          path: dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 – Firebase Hosting: PR preview
  # ─────────────────────────────────────────────────────────────────────────────
  firebase-pr-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run prebuild
          bash -c 'source ./config.sh && npx vite build'

      - name: Deploy PR Preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEGO_BREEZE }}'
          projectId: pokego-breeze
