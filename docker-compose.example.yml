# ─────────────────────────────────────────────────────────────────────────────
# PokeGoBreeze – Docker Compose Example
# Copy this file to docker-compose.yml and update values to match your .env
# docker-compose.yml is gitignored – do NOT commit it with real credentials
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Development service with hot-reloading (Vite dev server on :9000)
  app-dev:
    container_name: pokego-breeze-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    # The source bind mount includes local .env/config.json files when present;
    # the development entrypoint loads them inside the container.
    networks:
      - pokego-network

  # Self-contained production image (builds the app, then serves it with Nginx)
  app-prod:
    container_name: pokego-breeze-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - NODE_ENV=production
    # .env is COPY'd into the build context by Dockerfile (COPY . .)
    # so config.sh can read it during `npm run deploy` at build time.
    networks:
      - pokego-network

networks:
  pokego-network:
    driver: bridge
